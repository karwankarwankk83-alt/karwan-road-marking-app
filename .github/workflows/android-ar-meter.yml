name: Build KS Native AR Meter

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-ar-meter/**'
      - '.github/workflows/android-ar-meter.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create CI signing keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        working-directory: android-ar-meter
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-ar-meter/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KS-Native-AR-Meter-signed-installable
          path: android-ar-meter/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
