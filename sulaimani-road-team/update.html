<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17384f">
<title>نوێکردنەوەی تیمی بۆیاخ</title>
<style>
html,body{margin:0;min-height:100%;background:#0f1b24;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(440px,100%);background:#fff;color:#17384f;border-radius:22px;padding:26px;box-sizing:border-box;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}.spin{font-size:42px}.msg{font-size:20px;font-weight:800;line-height:1.8}.sub{margin-top:10px;color:#65727c;line-height:1.7}button{display:none;width:100%;margin-top:18px;border:0;border-radius:12px;padding:13px;background:#17384f;color:#fff;font-size:17px;font-weight:900}
</style>
</head>
<body>
<div class="card"><div class="spin">🔄</div><div id="msg" class="msg">وەشانی نوێی «تیمی بۆیاخ» دادەگیرێت...</div><div id="sub" class="sub">تکایە ئەم پەڕەیە مەداخە.</div><button id="go">کردنەوەی ئەپ</button></div>
<script>
(async()=>{
 const msg=document.getElementById('msg'),sub=document.getElementById('sub'),go=document.getElementById('go');
 const target='./?build=33&fresh='+Date.now();
 try{
   if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('sulaimani-road-team-')).map(k=>caches.delete(k)));}
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.filter(r=>r.scope.includes('/sulaimani-road-team/')).map(r=>r.unregister()));
     const reg=await navigator.serviceWorker.register('./sw.js?v=33',{scope:'./',updateViaCache:'none'});
     await reg.update();
     await navigator.serviceWorker.ready;
   }
   msg.textContent='✅ وەشانی نوێ ئامادەیە';
   sub.textContent='ئێستا ئەپەکە بە وەشانی تازە دەکرێتەوە.';
   setTimeout(()=>location.replace(target),900);
 }catch(e){
   console.error(e);
   msg.textContent='وەشانی نوێ ئامادەیە';
   sub.textContent='دوگمەکە دابگرە بۆ کردنەوەی وەشانی تازە.';
   go.style.display='block';
   go.onclick=()=>location.replace(target);
 }
})();
</script>
</body>
</html>
