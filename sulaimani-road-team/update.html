<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17384f">
<title>نوێکردنەوەی تیمی بۆیاخ</title>
<style>
html,body{margin:0;min-height:100%;background:#0f1b24;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(440px,100%);background:#fff;color:#17384f;border-radius:22px;padding:26px;box-sizing:border-box;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}.spin{font-size:42px}.msg{font-size:20px;font-weight:800;line-height:1.8}.sub{margin-top:10px;color:#65727c;line-height:1.8}.done{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#eef7f0;color:#176b34;font-weight:900}
</style>
</head>
<body>
<div class="card"><div class="spin">🔄</div><div id="msg" class="msg">وەشانی نوێی «تیمی بۆیاخ» دادەگیرێت...</div><div id="sub" class="sub">تکایە ئەم پەڕەیە مەداخە.</div><div id="done" class="done">✅ ئێستا Chrome/Safari داخە و تەنها لە ئایکۆنی «تیمی بۆیاخ» ئەپەکە بکەرەوە.</div></div>
<script>
(async()=>{
 const msg=document.getElementById('msg'),sub=document.getElementById('sub'),done=document.getElementById('done');
 try{
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.filter(k=>k.startsWith('sulaimani-road-team-')).map(k=>caches.delete(k)));
   }
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.filter(r=>r.scope.includes('/sulaimani-road-team/')).map(r=>r.unregister()));
     const reg=await navigator.serviceWorker.register('./sw.js?v=33',{scope:'./',updateViaCache:'none'});
     await reg.update();
     await navigator.serviceWorker.ready;
     if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
   }
   msg.textContent='✅ وەشانی نوێ ئامادەیە';
   sub.textContent='ئەم پەڕەیە چیتر ناچێتە ناو ئەپ. بۆ ئەوەی براوزەر بە هەڵە وەک ئەندامێکی نوێ تۆمار نەبێت، ئێستا براوزەرەکە داخە.';
   done.style.display='block';
 }catch(e){
   console.error(e);
   msg.textContent='⚠️ نوێکردنەوە تەواو نەبوو';
   sub.textContent='ئینتەرنێت بپشکنە و ئەم پەڕەیە Reload بکە.';
 }
})();
</script>
</body>
</html>
