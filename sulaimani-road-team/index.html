<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b4f86"><title>کار و چالاکییەکانی تیمی هێڵکاری و بۆیاخ</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><small>بەڕێوەبەرایەتی هاتوچۆی سلێمانی</small><h1>کار و چالاکییەکانی تیمی هێڵکاری و بۆیاخ</h1></div><button id="assistantBtn">یاریدەدەری زیرەک ✦</button></header><main><section class="hero"><h2>بەخێربێیت</h2><p>تۆمارکردن، ڕاپۆرت و بەدواداچوونی کاری ڕۆژانەی تیم</p><div class="roles"><span>تیم‌لیدەر</span><span>سەرۆکی هۆبە</span><span>بەڕێوەبەر</span></div></section><section class="grid"><button data-view="new">＋ زەرعەی نوێ</button><button data-view="reports">ڕاپۆرتەکان</button><button data-view="materials">ماددەکان</button><button data-view="team">ستافی تیم</button><button data-view="map">نەخشە و GPS</button><button data-view="stats">ئامار</button></section><section id="panel" class="panel"><h3>زەرعەی نوێ</h3><form id="workForm"><label>بەروار<input type="date" name="date"></label><label>شوێنی کار<input name="location" placeholder="ناوی شەقام / ناوچە"></label><label>جۆری کار<select name="type"><option>هێڵکاری</option><option>زێبرا</option><option>نیشانەی سەر شەقام</option><option>بۆیاخی تایبەت</option></select></label><div class="two"><label>درێژی (m)<input type="number" step="0.01" name="length"></label><label>پانی (cm)<input type="number" step="0.1" name="width"></label></div><label>تێبینی<textarea name="note" rows="4"></textarea></label><button class="primary" type="submit">پاشەکەوتکردن</button></form></section><section class="materials"><h3>ماددە و کەرەستەکان</h3><div id="materialList"></div></section></main><nav><button>ژینگەیەکی پاکتر</button><button>شەقامێکی جوانتر</button><button>کوالێتی</button><button>تیمی کار</button><button>سەلامەتی</button></nav></div><div id="assistant" class="assistant hidden"><div class="assistant-card"><button id="closeAssistant">×</button><h3>یاریدەدەری زیرەک</h3><p>ئامادەم بۆ یارمەتی دان لە تۆمارکردن، ژماردن و ڕاپۆرت.</p><div id="chat"></div><div class="chatbar"><input id="chatInput" placeholder="پرسیارەکەت بنووسە..."><button id="sendChat">ناردن</button></div></div></div><script src="app.js"></script></body></html>
